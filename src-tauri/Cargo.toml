[package]
name = "storeiq"
version = "0.1.0"
description = "StoreIQ — Retail Inventory Management Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "storeiq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "storeiq"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "protocol-asset", "fs-read-file", "fs-create-dir", "fs-read-dir", "dialog-all", "fs-copy-file", "fs-write-file",
  "notification-all",
  "shell-open",
] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
once_cell = "1"
dirs = "5"

[features]
custom-protocol = ["tauri/custom-protocol"]
